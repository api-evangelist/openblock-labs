name: OpenBlock Labs
description: >-
  OpenBlock Labs builds OB-1, a self-improving autonomous coding agent that
  automates the software development lifecycle from PM to PR. OB-1 runs as a
  native terminal CLI and inside VS Code and JetBrains IDEs, consumes MCP
  (Model Context Protocol) servers for custom tool integration, and provides a
  built-in browser agent. It routes across 300+ models via OpenRouter with
  bring-your-own-keys, bills usage-based at 1:1 model-token pass-through, and
  integrates with GitHub, Linear, Graphite, and Slack. Access is authenticated
  through a standards-compliant OAuth 2.0 / OpenID Connect authorization server
  (auth.openblocklabs.com, WorkOS AuthKit), with SSO/SAML, self-hosting, and
  audit logging available on enterprise plans. Originally surfaced as a
  portfolio company of Electric Capital and enriched by the API Evangelist
  pipeline from its public product surface and published auth metadata.
